<body class="ready">
<header id="siteHeader"></header>
<main>
  <div id="profileHead" class="topic-header"><div><span class="skel" style="width:220px;height:30px"></span></div></div>
  <div class="tabs-list" role="tablist" style="display:inline-flex;margin-bottom:16px">
    <button class="tab-btn active" data-ptab="intuitions" role="tab">Intuitions (<span id="pIntCount">…</span>)</button>
    <button class="tab-btn" data-ptab="takeaways" role="tab">Takeaways (<span id="pTakCount">…</span>)</button>
  </div>
  <div id="pList" class="activity-list"></div>
</main>
<script>
let pData = { intuitions: [], takeaways: [] }, pTab = 'intuitions';

function activityRow(item, links, titles, totals) {
  const t = totals[item.$id] || { up: 0, down: 0 }, score = t.up - t.down;
  const text = item.statement || item.content || '';
  const href = links[item.question_id];
  return `<div class="activity-row">
    <div class="activity-score ${score > 0 ? 'positive' : score < 0 ? 'negative' : ''}" title="Score">${score}</div>
    <div class="activity-body">
      <div class="activity-text kr">${esc(text.length > 220 ? text.slice(0, 220) + '…' : text)}</div>
      <div class="activity-meta">on ${href ? `<a href="${esc(href)}">${esc(titles[item.question_id] || 'a question')}</a>` : 'a deleted question'} · ${ago(item.$createdAt)}</div>
    </div></div>`;
}
async function renderTab() {
  document.querySelectorAll('[data-ptab]').forEach(b => { b.classList.toggle('active', b.dataset.ptab === pTab); b.setAttribute('aria-selected', b.dataset.ptab === pTab); });
  const items = pData[pTab], el = document.getElementById('pList');
  el.innerHTML = items.length ? items.map(i => activityRow(i, pData.links, pData.titles, pData.totals)).join('')
    : `<div class="empty-state">No ${pTab} yet.</div>`;
  renderMath(el);
}
document.querySelectorAll('[data-ptab]').forEach(b => b.addEventListener('click', () => { pTab = b.dataset.ptab; renderTab(); }));

(async () => {
  document.getElementById('pList').innerHTML = '<div class="empty-state">Loading…</div>';
  startPage();
  const username = new URLSearchParams(location.search).get('u') || '';
  const head = document.getElementById('profileHead');
  try {
    const res = await databases.listDocuments(DB_ID, COLLECTIONS.profiles, [Query.equal('username', username), Query.limit(1)]);
    const p = res.documents.find(d => ownedRow(d, d.$id));
    if (!p) { head.innerHTML = `<div><h1 class="topic-name">No such user</h1><div class="topic-desc">Nobody is called “${esc(username)}”.</div></div>`; document.getElementById('pList').innerHTML = ''; return; }
    document.title = `${p.username} — MINT`;
    const [ints, taks] = await Promise.all(['intuitions', 'takeaways'].map(t =>
      databases.listDocuments(DB_ID, t, [Query.equal('author_id', p.$id), Query.orderDesc('$createdAt'), Query.limit(100)])));
    pData.intuitions = ints.documents.filter(i => ownedRow(i, p.$id));
    pData.takeaways  = taks.documents.filter(i => ownedRow(i, p.$id));
    const all = [...pData.intuitions, ...pData.takeaways], qIds = [...new Set(all.map(i => i.question_id))];
    const [links, totals, qs] = await Promise.all([
      questionLinks(qIds), fetchVoteTotals(all.map(i => i.$id)),
      qIds.length ? databases.listDocuments(DB_ID, COLLECTIONS.questions, [Query.equal('$id', qIds.slice(0, 100)), Query.limit(100)]) : { documents: [] },
    ]);
    pData.links = links; pData.totals = totals;
    pData.titles = Object.fromEntries(qs.documents.map(q => [q.$id, q.title.replace(/\$\$?[^$]*\$\$?/g, '').trim() || q.title]));
    const score = Object.values(totals).reduce((s, t) => s + t.up - t.down, 0);
    head.innerHTML = `<div class="topic-left"><div>
      <h1 class="topic-name">${esc(p.username)}</h1>
      <div class="topic-desc">Joined ${ago(p.$createdAt)} · ${all.length} post${all.length === 1 ? '' : 's'} · ${score} total score</div></div></div>`;
    document.getElementById('pIntCount').textContent = pData.intuitions.length;
    document.getElementById('pTakCount').textContent = pData.takeaways.length;
    renderTab();
  } catch (e) {
    document.getElementById('pList').innerHTML = `<div class="err-box">Could not load this profile: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
